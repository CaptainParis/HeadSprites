name: HeadSprites
version: '1.2'
main: paris.headsprites.HeadSprites
api-version: '1.21'
author: CaptainParis
description: Inline custom head sprites in chat via MineSkin + MiniMessage object components
softdepend: [PlaceholderAPI]

commands:
  sprite:
    description: Manage head sprites (generate via MineSkin, list, anim, reload)
    usage: /sprite <generate|list|anim <list|display|stop>|reload>
    permission: headsprites.admin

permissions:
  headsprites.admin:
    description: Allows managing head sprites via /sprite
    default: op
  headsprites.chatformat:
    description: Allows using full MiniMessage formatting (not just sprite tags) in chat
    default: op
